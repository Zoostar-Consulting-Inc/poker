# --- Spring Boot specific properties for local ---
logging:
  level:
    root: info
    '[net.zoostar]': trace
    '[com.zoostarinc]': trace

logs:
  base:
    dir: logs

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048
